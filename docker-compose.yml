version: '3.8'

services:
  # MongoDB Database
  mongodb:
    image: mongo:6.0
    container_name: coursehive-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: coursehive
    volumes:
      - mongodb_data:/data/db
    networks:
      - coursehive-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: coursehive-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - coursehive-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: coursehive-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://admin:password@mongodb:27017/coursehive?authSource=admin
      JWT_SECRET: your_jwt_secret_key_here
      REDIS_URL: redis://redis:6379
      AI_EVALUATOR_URL: http://ai-evaluator:8000
      SCRAPER_URL: http://scraper:8001
    depends_on:
      - mongodb
      - redis
    networks:
      - coursehive-network

  # AI Evaluator Service
  ai-evaluator:
    build:
      context: ./ai-evaluator
      dockerfile: Dockerfile
    container_name: coursehive-ai-evaluator
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/coursehive?authSource=admin
    depends_on:
      - mongodb
    networks:
      - coursehive-network

  # Web Scraper Service
  scraper:
    build:
      context: ./scraper
      dockerfile: Dockerfile
    container_name: coursehive-scraper
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      MONGODB_URI: mongodb://admin:password@mongodb:27017/coursehive?authSource=admin
    depends_on:
      - mongodb
    networks:
      - coursehive-network

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: coursehive-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks:
      - coursehive-network

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: coursehive-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - frontend
      - backend
    networks:
      - coursehive-network

volumes:
  mongodb_data:
  redis_data:

networks:
  coursehive-network:
    driver: bridge
